name: Daily Cherry Blossom Update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write  

jobs:
  update-prediction:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}  
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r portfolio/ml/cherry_blossom/scripts/requirements.txt
    
    - name: Run prediction update
      env:
        RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
      working-directory: portfolio/ml/cherry_blossom/scripts
      run: |
        python cherry_blossom_workflow.py --update
    
    - name: Commit and push if changed
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        
        git add portfolio/ml/cherry_blossom/*.json || true
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🌸 Update predictions - $(date +'%Y-%m-%d')"
          git push
        fi