name: Cherry Blossom Daily Update

on:
  schedule:
    - cron: '0 7 * * *'    # runs every day at 07:00 UTC (9:00 Bonn time)
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  update-prediction:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit updated JSON files back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: pip install -r portfolio/ml/cherry_blossom/scripts/requirements.txt

      - name: Run daily update
        env:
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
        run: python portfolio/ml/cherry_blossom/scripts/cherry_blossom_workflow.py --update

      - name: Commit updated predictions
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            portfolio/ml/cherry_blossom/cherry_blossom_prediction.json \
            portfolio/ml/cherry_blossom/all_predictions_2026.json \
            portfolio/ml/cherry_blossom/data/daily/weather_2024_2025.csv \
            portfolio/ml/cherry_blossom/data/output/ \
            portfolio/ml/cherry_blossom/cherry_blossom_workflow.log

          # Only commit if something actually changed
          git diff --cached --quiet || git commit -m "chore: daily prediction update $(date +'%Y-%m-%d')"
          git push