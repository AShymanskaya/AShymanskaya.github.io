name: Daily Cherry Blossom Update

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC daily
  workflow_dispatch:      # Manual trigger
  push:
    branches: [main]

jobs:
  update-prediction:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt
    
    - name: Run prediction update
      env:
        RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
      run: |
        cd scripts
        python cherry_blossom_workflow.py --update
        
        # Weekly full prediction generation
        if [ $(date +%u) -eq 1 ]; then
          echo "Monday - generating full daily predictions"
          python cherry_blossom_workflow.py --daily
        fi
    
    - name: Copy predictions to docs
      run: |
        mkdir -p docs
        cp -f data/output/cherry_blossom_prediction.json docs/ || echo "No prediction file yet"
        cp -f data/output/all_predictions_2026.json docs/ || echo "No all predictions file yet"
    
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/*.json
        git diff --staged --quiet || git commit -m "🌸 Update predictions - $(date +'%Y-%m-%d')"
        git push || echo "No changes to push"